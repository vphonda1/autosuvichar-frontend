<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Auto Suvichar</title>
    <meta name="description" content="रोज़ का marketing content — पोस्टर, वीडियो, सुविचार और डिलीवरी पोस्ट, सब एक जगह" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- iPhone / iPad -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Auto Suvichar" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- App की तरह लगे: text select और bounce बंद -->
    <style>
      html, body { background: #0a0a0a; overscroll-behavior-y: none; }
      body { -webkit-tap-highlight-color: transparent; }
      /* input में लिखना ज़रूरी है, इसलिए वहाँ select चालू रखो */
      input, textarea, select, [contenteditable] { -webkit-user-select: text; user-select: text; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
